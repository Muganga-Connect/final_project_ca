<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MugangaConnect+ | Page Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #534AB7 0%, #0F6E56 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card-404 {
      background: white;
      border-radius: 24px;
      padding: 60px 48px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    }

    .icon-circle {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #EEEDFE, #E1F5EE);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon-circle i {
      font-size: 48px;
      background: linear-gradient(135deg, #534AB7, #0F6E56);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-code {
      font-size: 80px;
      font-weight: 900;
      background: linear-gradient(135deg, #534AB7, #0F6E56);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 700;
      color: #141413;
      margin-bottom: 12px;
    }

    .error-desc {
      color: #6b6b68;
      font-size: 15px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .btn-home {
      background: linear-gradient(135deg, #534AB7, #0F6E56);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }

    .btn-home:hover {
      opacity: 0.9;
      color: white;
    }

    .btn-back {
      background: #f5f4ed;
      color: #534AB7;
      border: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
      margin-left: 12px;
    }

    .btn-back:hover {
      background: #EEEDFE;
      color: #534AB7;
    }

    .brand {
      margin-top: 36px;
      color: #b0afaa;
      font-size: 13px;
    }

    .brand i {
      color: #534AB7;
    }
  </style>
</head>
<body>
  <div class="card-404">

    <div class="icon-circle">
      <i class="bi bi-heartbreak"></i>
    </div>

    <div class="error-code">404</div>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-desc">
      Oops! The page you are looking for doesn't exist or has been moved.
      Please check the URL or go back to the dashboard.
    </p>

    <div>
      <a href="dashboard.html" class="btn-home">
        <i class="bi bi-grid me-2"></i>Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn-back">
        <i class="bi bi-arrow-left me-2"></i>Go Back
      </a>
    </div>

    <p class="brand">
      <i class="bi bi-heart-pulse-fill me-1"></i>
      MugangaConnect+ &copy; 2026
    </p>

  </div>
</body>
</html>
