<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MugangaConnect+ | Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
</head>
<body>

  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <h5><i class="bi bi-heart-pulse-fill me-2"></i>MugangaConnect+</h5>
      <p>Doctor Portal</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="bi bi-grid"></i> Dashboard</a>
      <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-check"></i> Appointments</a>
      <a href="patients.html" class="nav-item active"><i class="bi bi-people"></i> Patients</a>
    </nav>
    <div class="sidebar-footer">
      <div class="doctor-info">
        <div class="doctor-avatar"><i class="bi bi-person-fill"></i></div>
        <div>
          <p class="doctor-name" id="doctorName">Doctor</p>
          <p class="doctor-role">Medical Doctor</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <i class="bi bi-box-arrow-left me-2"></i>Logout
      </button>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">
    <div class="topbar">
      <div>
        <h4>Patients</h4>
        <p>View all registered patients and their profiles</p>
      </div>
      <input type="text" class="search-bar" id="searchInput" placeholder="🔍  Search patient..." oninput="searchPatients()"/>
    </div>

    <!-- Patient Cards -->
    <div class="row g-4" id="patientsGrid">
      <div class="col-12">
        <div class="empty-state">
          <i class="bi bi-people d-block"></i>
          <p>Loading patients...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Patient Detail Modal -->
  <div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:16px;">
        <div class="modal-header" style="background:#534AB7;border-radius:16px 16px 0 0;">
          <h5 class="modal-title text-white"><i class="bi bi-person-circle me-2"></i>Patient Profile</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="modalBody"></div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let allPatients = [];

    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('doctorName').textContent = user.email.split('@')[0];
      loadPatients();
    });

    function loadPatients() {
      db.collection('patients').get().then(snapshot => {
        allPatients = [];
        snapshot.forEach(doc => allPatients.push({ id: doc.id, ...doc.data() }));
        renderPatients(allPatients);
      });
    }

    function renderPatients(data) {
      const grid = document.getElementById('patientsGrid');
      if (data.length === 0) {
        grid.innerHTML = `<div class="col-12"><div class="empty-state">
          <i class="bi bi-people d-block"></i><p>No patients found.</p></div></div>`;
        return;
      }

      grid.innerHTML = data.map(p => `
        <div class="col-md-4">
          <div class="table-card h-100" style="cursor:pointer;" onclick="viewPatient('${p.id}')">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div style="width:52px;height:52px;background:#EEEDFE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
                <i class="bi bi-person-fill" style="color:#534AB7;font-size:22px;"></i>
              </div>
              <div>
                <h6 class="mb-0 fw-700">${p.name || 'N/A'}</h6>
                <small class="text-muted">${p.email || 'N/A'}</small>
              </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <span style="background:#f5f4ed;padding:4px 10px;border-radius:8px;font-size:12px;color:#6b6b68;">
                <i class="bi bi-telephone me-1"></i>${p.phone || 'N/A'}
              </span>
              <span style="background:#E1F5EE;padding:4px 10px;border-radius:8px;font-size:12px;color:#0F6E56;">
                <i class="bi bi-calendar-check me-1"></i>View appointments
              </span>
            </div>
          </div>
        </div>`).join('');
    }

    function viewPatient(id) {
      const p = allPatients.find(p => p.id === id);
      if (!p) return;

      // Load patient appointments
      db.collection('appointments').where('patientId', '==', id).get().then(snap => {
        let apptRows = '';
        snap.forEach(doc => {
          const d = doc.data();
          apptRows += `<tr>
            <td>${d.date || 'N/A'}</td>
            <td>${d.time || 'N/A'}</td>
            <td><span class="badge-${d.status || 'pending'}">${(d.status || 'pending').toUpperCase()}</span></td>
          </tr>`;
        });

        document.getElementById('modalBody').innerHTML = `
          <div class="d-flex align-items-center gap-3 mb-4">
            <div style="width:64px;height:64px;background:#EEEDFE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-person-fill" style="color:#534AB7;font-size:28px;"></i>
            </div>
            <div>
              <h5 class="mb-0 fw-bold">${p.name || 'N/A'}</h5>
              <p class="text-muted mb-0">${p.email || 'N/A'}</p>
            </div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <div style="background:#f5f4ed;padding:12px;border-radius:10px;">
                <small class="text-muted d-block">Phone</small>
                <strong>${p.phone || 'N/A'}</strong>
              </div>
            </div>
            <div class="col-6">
              <div style="background:#f5f4ed;padding:12px;border-radius:10px;">
                <small class="text-muted d-block">Biometric</small>
                <strong>${p.biometricEnabled ? '✅ Enabled' : '❌ Disabled'}</strong>
              </div>
            </div>
          </div>
          <h6 class="fw-bold mb-3">Appointment History</h6>
          ${apptRows ? `<table class="table"><thead><tr><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>${apptRows}</tbody></table>`
            : '<p class="text-muted">No appointments found.</p>'}`;

        new bootstrap.Modal(document.getElementById('patientModal')).show();
      });
    }

    function searchPatients() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderPatients(allPatients.filter(p =>
        (p.name || '').toLowerCase().includes(q) ||
        (p.email || '').toLowerCase().includes(q)
      ));
    }

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
