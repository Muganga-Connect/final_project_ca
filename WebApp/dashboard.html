<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MugangaConnect+ | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
</head>
<body>

  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <h5><i class="bi bi-heart-pulse-fill me-2"></i>MugangaConnect+</h5>
      <p>Doctor Portal</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item active"><i class="bi bi-grid"></i> Dashboard</a>
      <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-check"></i> Appointments</a>
      <a href="patients.html" class="nav-item"><i class="bi bi-people"></i> Patients</a>
    </nav>
    <div class="sidebar-footer">
      <div class="doctor-info">
        <div class="doctor-avatar"><i class="bi bi-person-fill"></i></div>
        <div>
          <p class="doctor-name" id="doctorName">Doctor</p>
          <p class="doctor-role">Medical Doctor</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <i class="bi bi-box-arrow-left me-2"></i>Logout
      </button>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">
    <div class="topbar">
      <div>
        <h4>Dashboard</h4>
        <p id="greeting">Welcome back, Doctor</p>
      </div>
      <div style="color:#6b6b68;font-size:14px;">
        <i class="bi bi-calendar3 me-1"></i>
        <span id="currentDate"></span>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="stat-card purple">
          <div class="stat-icon"><i class="bi bi-calendar-check"></i></div>
          <h3 id="totalCount">0</h3>
          <p>Total Appointments</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card orange">
          <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
          <h3 id="pendingCount">0</h3>
          <p>Pending</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card green">
          <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
          <h3 id="confirmedCount">0</h3>
          <p>Confirmed</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card red">
          <div class="stat-icon"><i class="bi bi-x-circle"></i></div>
          <h3 id="missedCount">0</h3>
          <p>Missed</p>
        </div>
      </div>
    </div>

    <!-- Recent Appointments -->
    <div class="table-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5><i class="bi bi-clock-history me-2" style="color:#534AB7;"></i>Recent Appointments</h5>
        <a href="appointments.html" class="btn btn-sm" style="background:#EEEDFE;color:#534AB7;font-weight:600;border-radius:8px;">
          View All <i class="bi bi-arrow-right ms-1"></i>
        </a>
      </div>
      <div id="recentTableBody">
        <div class="empty-state">
          <i class="bi bi-calendar-x d-block"></i>
          <p>Loading appointments...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // Set current date
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // Auth check
    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('doctorName').textContent = user.email.split('@')[0];
      document.getElementById('greeting').textContent = `Welcome back, ${user.email.split('@')[0]}`;
      loadStats();
      loadRecentAppointments();
    });

    function loadStats() {
      db.collection('appointments').get().then(snapshot => {
        let total = 0, pending = 0, confirmed = 0, missed = 0;
        snapshot.forEach(doc => {
          const d = doc.data();
          total++;
          if (d.status === 'pending')   pending++;
          if (d.status === 'confirmed') confirmed++;
          if (d.status === 'missed')    missed++;
        });
        document.getElementById('totalCount').textContent     = total;
        document.getElementById('pendingCount').textContent   = pending;
        document.getElementById('confirmedCount').textContent = confirmed;
        document.getElementById('missedCount').textContent    = missed;
      });
    }

    function loadRecentAppointments() {
      db.collection('appointments').orderBy('date', 'desc').limit(5).get()
        .then(snapshot => {
          if (snapshot.empty) {
            document.getElementById('recentTableBody').innerHTML = `
              <div class="empty-state">
                <i class="bi bi-calendar-x d-block"></i>
                <p>No appointments found.</p>
              </div>`;
            return;
          }
          let rows = `<table class="table">
            <thead><tr>
              <th>Patient</th><th>Date</th><th>Time</th><th>Status</th>
            </tr></thead><tbody>`;
          snapshot.forEach(doc => {
            const d = doc.data();
            rows += `<tr>
              <td><i class="bi bi-person-circle me-2" style="color:#534AB7;"></i>${d.patientName || 'N/A'}</td>
              <td>${d.date || 'N/A'}</td>
              <td>${d.time || 'N/A'}</td>
              <td><span class="badge-${d.status || 'pending'}">${(d.status || 'pending').toUpperCase()}</span></td>
            </tr>`;
          });
          rows += '</tbody></table>';
          document.getElementById('recentTableBody').innerHTML = rows;
        });
    }

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
