<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MugangaConnect+ | Doctor Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #534AB7 0%, #0F6E56 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo-circle {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #534AB7, #0F6E56);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .btn-login {
      background: linear-gradient(135deg, #534AB7, #0F6E56);
      border: none;
      color: white;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      width: 100%;
    }
    .btn-login:hover { opacity: 0.9; color: white; }
    .form-control:focus {
      border-color: #534AB7;
      box-shadow: 0 0 0 0.2rem rgba(83,74,183,0.2);
    }
    .error-msg { color: #dc3545; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-circle">
      <i class="bi bi-heart-pulse-fill text-white fs-3"></i>
    </div>
    <h4 class="text-center fw-bold mb-1" style="color:#534AB7;">MugangaConnect+</h4>
    <p class="text-center text-muted mb-4">Doctor Portal</p>

    <div id="errorMsg" class="alert alert-danger error-msg mb-3"></div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" id="email" class="form-control" placeholder="doctor@hospital.com"/>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Enter your password"/>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button class="btn-login btn mb-3" onclick="login()">
      <span id="loginText">Login</span>
      <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
    </button>

    <p class="text-center text-muted small mt-3">
      MugangaConnect+ &copy; 2026
    </p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const spinner = document.getElementById('loginSpinner');
      const loginText = document.getElementById('loginText');

      errorMsg.style.display = 'none';

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.style.display = 'block';
        return;
      }

      spinner.classList.remove('d-none');
      loginText.textContent = 'Logging in...';

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          // Check if user is a doctor in Firestore
          return db.collection('doctors').doc(userCredential.user.uid).get();
        })
        .then(doc => {
          if (doc.exists) {
            window.location.href = 'dashboard.html';
          } else {
            auth.signOut();
            errorMsg.textContent = 'Access denied. This portal is for doctors only.';
            errorMsg.style.display = 'block';
          }
        })
        .catch(error => {
          errorMsg.textContent = 'Invalid email or password.';
          errorMsg.style.display = 'block';
        })
        .finally(() => {
          spinner.classList.add('d-none');
          loginText.textContent = 'Login';
        });
    }

    // If already logged in redirect to dashboard
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
